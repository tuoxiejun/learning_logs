{% extends 'learning_logs/base.html' %}

{% block page_header %}
<div class="d-flex justify-content-between align-items-center">
  <div>
    <div class="text-muted small">学习空间</div>
    <h2 class="h4 mb-0">我的主题</h2>
  </div>
  <a class="btn btn-primary rounded-pill px-3" href="{% url 'learning_logs:new_topic' %}">+ 新建主题</a>
</div>
{% endblock page_header %}

{% block content %}
<div class="list-group list-group-flush">
  {% for topic in topics %}
    <div class="list-group-item px-0 py-3 border-0 border-bottom">
      <div class="d-flex justify-content-between align-items-center">
        <a class="text-decoration-none fw-semibold" href="{% url 'learning_logs:topic' topic.id %}">
          {{ topic.text }}
        </a>
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted small">{{ topic.date_added|date:'Y-m-d' }}</span>
          <form action="{% url 'learning_logs:delete_topic' topic.id %}" method="post" onsubmit="return confirm('确定删除这个主题及其所有条目吗？');">
            {% csrf_token %}
            <button class="btn btn-sm btn-outline-danger rounded-pill px-3" type="submit">删除</button>
          </form>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="alert alert-info mb-0">还没有主题，先创建你的第一个主题吧。</div>
  {% endfor %}
</div>
{% endblock content %}
